<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Élite Comercial | Gestión de Equipo & Convención</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
    .navy-gradient { background: linear-gradient(135deg, #090d16 0%, #0f172a 55%, #1e293b 100%); }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .card-shadow { box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-white">

  <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- ========================================================= -->
  <!-- 1. CONFIGURACIÓN PRINCIPAL (YA CONECTADO A TU GOOGLE SHEET)-->
  <!-- ========================================================= -->
  <script>
    const CONFIG = {
      // 1. Tu URL real de Google Apps Script ya está conectada:
      GOOGLE_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxXV8cXWRzBG2qMYsf1-RdCD56KTJ6nTxSSo7VkBBXl90WzrUYbbF9F3VyuJHWSYvtFfw/exec",

      // 2. Usuario y contraseña del Director / Administrador:
      ADMIN_USER: "admin",
      ADMIN_PASS: "2026",

      // 3. Metas por defecto (en cantidad de ventas/unidades):
      DEFAULT_META_MENSUAL: 5,
      DEFAULT_META_CONVENCION: 45,
      META_BONO_TRIMESTRAL: 11, // >= 11 ventas en el trimestre califica a bono
      DEFAULT_ADVISOR_PASS: "1234", // Contraseña por defecto si un asesor aún no tiene clave asignada

      // 4. Nombre de tu agencia o equipo comercial:
      COMPANY_NAME: "Élite Comercial"
    };
  </script>

  <!-- ========================================================= -->
  <!-- PANTALLA 1: INICIO DE SESIÓN (ASESOR CON CLAVE / DIRECTOR)-->
  <!-- ========================================================= -->
  <div id="login-view" class="min-h-screen navy-gradient flex flex-col justify-between p-4 sm:p-6 relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header superior -->
    <header class="max-w-5xl w-full mx-auto flex items-center justify-between z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center shadow-lg shadow-amber-500/20">
          <i data-lucide="trophy" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span id="login-brand-name" class="text-white font-display font-bold text-lg tracking-tight block leading-none">ÉLITE COMERCIAL</span>
          <span class="text-amber-400 text-[11px] font-medium tracking-wider uppercase">Metas, Bonos & Convención</span>
        </div>
      </div>

      <button onclick="openSheetsModal()" title="Configurar conexión Google Sheets" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-medium transition border border-white/10">
        <i data-lucide="settings" class="w-4 h-4 text-amber-400"></i>
        <span class="hidden sm:inline">Configurar</span>
      </button>
    </header>

    <!-- Tarjeta Central de Acceso -->
    <main class="max-w-md w-full mx-auto my-auto z-10 py-6">
      <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        <!-- Selector de Rol -->
        <div class="grid grid-cols-2 bg-slate-100 p-1.5 m-4 rounded-2xl">
          <button id="role-btn-advisor" onclick="switchLoginRole('advisor')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm">
            <i data-lucide="smartphone" class="w-4 h-4 text-emerald-600"></i>
            Asesor Comercial
          </button>
          <button id="role-btn-admin" onclick="switchLoginRole('admin')" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800">
            <i data-lucide="shield-check" class="w-4 h-4 text-amber-600"></i>
            Director / Admin
          </button>
        </div>

        <!-- Formulario Asesor (Celular + Contraseña asignada por Director) -->
        <div id="login-advisor-panel" class="px-6 pb-7 pt-2">
          <div class="text-center mb-6">
            <h1 class="font-display font-bold text-xl text-slate-900">Portal del Asesor</h1>
            <p class="text-slate-500 text-xs sm:text-sm mt-1">Ingresa tu número celular y la contraseña asignada por la Dirección Comercial.</p>
          </div>

          <form onsubmit="handleAdvisorLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Número de Celular (10 dígitos)</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 font-medium text-sm">+57</span>
                <input type="tel" id="advisor-phone-input" required maxlength="10" placeholder="Ej. 3001234567" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                  <i data-lucide="key-round" class="w-4 h-4"></i>
                </span>
                <input type="password" id="advisor-pass-input" required placeholder="••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
              </div>
            </div>

            <button type="submit" id="advisor-login-btn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-600/25 transition flex items-center justify-center gap-2">
              <span>Ingresar al Portal</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </form>
        </div>

        <!-- Formulario Administrador -->
        <div id="login-admin-panel" class="px-6 pb-7 pt-2 hidden">
          <div class="text-center mb-6">
            <h2 class="font-display font-bold text-xl text-slate-900">Dirección Comercial</h2>
            <p class="text-slate-500 text-xs sm:text-sm mt-1">Gestión de asesores, contraseñas, gráficas mensuales y bonos trimestrales.</p>
          </div>
          <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Usuario</label>
              <input type="text" id="admin-user-input" required placeholder="admin" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña</label>
              <input type="password" id="admin-pass-input" required placeholder="••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" />
            </div>
            <button type="submit" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
              <i data-lucide="lock" class="w-4 h-4 text-amber-400"></i>
              <span>Ingresar al Panel Director</span>
            </button>
          </form>
        </div>

        <!-- Barra inferior de estado de conexión -->
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex items-center justify-between text-[11px]">
          <div id="connection-status-badge"
